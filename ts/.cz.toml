[tool.commitizen]
name = "cz_ngff_zarr"
version = "0.22.0"
tag_format = "ts-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = ".commitizen/templates/ts_changelog.md.j2"
version_files = [
    "deno.json:version",
    "scripts/build_npm.ts:version"
]
bump_message = "chore(ts): bump @fideus-labs/ngff-zarr to version $new_version"
annotated_tag = true
gpg_sign = true
major_version_zero = true
# Format the generated CHANGELOG.md with `deno fmt` before it is staged and
# committed. cz writes the changelog, then runs pre_bump_hooks, then stages and
# commits the changelog + version files, so formatting here lands inside the
# bump commit and keeps CI's `deno fmt --check` green (avoids a follow-up
# "fix: format ts CHANGELOG" commit).
pre_bump_hooks = ["deno fmt CHANGELOG.md"]

[tool.commitizen.customize]
path = "../.commitizen"

[tool.commitizen.change_type_map]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
docs = "📚 Documentation"
style = "💎 Style"
refactor = "♻️ Refactoring"
perf = "⚡ Performance"
test = "✅ Testing"
build = "📦 Build"
ci = "🔧 CI/CD"
chore = "🧹 Chores"

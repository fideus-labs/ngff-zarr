[tool.commitizen]
name = "cz_ngff_zarr"
version = "0.39.0"
tag_format = "ts-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = ".commitizen/templates/changelog.md.j2"
version_files = [
    "package.json:^  \"version\""
]
bump_message = "chore(ts): bump @fideus-labs/ngff-zarr to version $new_version"
annotated_tag = true
gpg_sign = true
major_version_zero = true
# cz writes the changelog and version files, then runs pre_bump_hooks, then
# stages and commits them all. The hooks sync package-lock.json's copy of the
# version and format the generated CHANGELOG.md, so both land inside the bump
# commit and CI's `npm run fmt:check` stays green.
pre_bump_hooks = [
    "npm install --package-lock-only --ignore-scripts --no-audit --no-fund",
    "npm run fmt -- CHANGELOG.md",
]

[tool.commitizen.customize]
path = "../.commitizen"

[tool.commitizen.change_type_map]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
docs = "📚 Documentation"
style = "💎 Style"
refactor = "♻️ Refactoring"
perf = "⚡ Performance"
test = "✅ Testing"
build = "📦 Build"
ci = "🔧 CI/CD"
chore = "🧹 Chores"

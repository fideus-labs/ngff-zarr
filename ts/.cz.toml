[tool.commitizen]
name = "cz_conventional_commits"
version = "0.5.1"
tag_format = "ts-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
version_files = [
    "deno.json:version",
    "scripts/build_npm.ts:version"
]
bump_message = "chore(ts): bump @fideus-labs/ngff-zarr to version $new_version"
annotated_tag = true
gpg_sign = true
major_version_zero = true

[tool.commitizen.change_type_map]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
docs = "📚 Documentation"
style = "💎 Style"
refactor = "♻️ Refactoring"
perf = "⚡ Performance"
test = "✅ Testing"
build = "📦 Build"
ci = "🔧 CI/CD"
chore = "🧹 Chores"

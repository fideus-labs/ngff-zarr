# Hook configuration for prek (https://prek.j178.dev/), a drop-in, Rust-based
# pre-commit replacement. The .pre-commit-config.yaml filename is kept for
# compatibility; prek reads it unchanged. CI runs these hooks via the prek
# GitHub Action (.github/workflows/prek.yml), and .github/workflows/
# prek-autoupdate.yml keeps hook revisions current.
exclude: (^.pixi/|.snap|pixi.lock)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.6.0"
    hooks:
      - id: check-added-large-files
        # Example notebooks are stored with their outputs, figures included.
        exclude: ^(mcp/test/data/input/MR-head\.nrrd|py/examples/.*\.ipynb)$
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        # gh-aw regenerates these files and emits trailing whitespace in their
        # ASCII banners; excluding them keeps `gh aw compile`/`upgrade` output
        # idempotent. Covers .github/agents/*.agent.md (dispatcher) and, under
        # .github/workflows/, the compiled *.lock.yml files and the generated
        # agentics-maintenance.yml.
        exclude: '^\.github/(agents/.*\.agent\.md|workflows/(.*\.lock\.yml|agentics-maintenance\.yml))$'
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        # See end-of-file-fixer above: keep gh-aw-generated artifacts verbatim.
        exclude: '^\.github/(agents/.*\.agent\.md|workflows/(.*\.lock\.yml|agentics-maintenance\.yml))$'

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.2.5"
    hooks:
      - id: codespell
        # Executed example notebooks embed base64 figures.
        exclude: ^(ts/deno\.lock|py/examples/.*\.ipynb)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.9.0.5"
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: py/test/conftest.py
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: "v4.13.0"
    hooks:
      - id: commitizen
        stages: [commit-msg]

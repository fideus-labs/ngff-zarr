[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
update_changelog_on_bump = false
major_version_zero = true
version_scheme = "semver"

# Commit types configuration
[tool.commitizen.change_type_map]
feat = "Features"
fix = "Bug Fixes"
docs = "Documentation"
style = "Style"
refactor = "Refactoring"
perf = "Performance"
test = "Testing"
build = "Build"
ci = "CI/CD"
chore = "Chores"

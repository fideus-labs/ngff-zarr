name: TypeScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11
        with:
          pixi-version: v0.69.0
          manifest-path: ./py/pyproject.toml
          frozen: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ts

      - name: Download test data
        run: pixi run -e test download-test-data
        working-directory: py

      - name: Build package
        run: npm run build:bundle
        working-directory: ts

      - name: Install browsers for playwright tests
        run: npx playwright install --with-deps
        working-directory: ts

      - name: Run all tests
        run: npm run test:all
        working-directory: ts

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: ts/test/browser-npm/test-results/
          retention-days: 7

  lint-and-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ts

      - name: Check formatting
        run: npm run fmt:check
        working-directory: ts

      - name: Run linter
        run: npm run lint
        working-directory: ts

      - name: Type check
        run: npm run typecheck
        working-directory: ts

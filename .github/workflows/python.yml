name: Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-26-intel]
        # zarr-python installs via the test extra as the read-verification
        # reference reader; every supported interpreter resolves 3.x. The
        # test-zarr2-reader job below covers the 2.x major so
        # zarrista-written stores are checked against both reader majors.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip if missing
        shell: bash
        run: |
          curl --retry-all-errors --retry 3 --tlsv1.2 https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python -m ensurepip --upgrade || python "$RUNNER_TEMP/get-pip.py"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "py/.[test,dask-image,itk,cli,validate]"

      - name: Test with pytest
        run: |
          cd py && pytest --junitxml=junit/test-results.xml

      - name: Publish Test Report
        if:
          ${{ matrix.os != 'ubuntu-22.04' && (matrix.os != 'macos-14' ||
          matrix.python-version != '3.8') }}
        uses: mikepenz/action-junit-report@v2
        with:
          report_paths: "junit/test-results*.xml"

  test-zarr2-reader:
    # zarrista-written stores must stay readable by both zarr-python
    # majors. The main matrix resolves zarr-python 3.x; this leg pins the
    # 2.x reader.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "py/.[test,dask-image,itk,cli,validate]" "zarr>=2.18,<3"

      - name: Test with pytest
        run: |
          cd py && pytest --junitxml=junit/test-results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v2
        with:
          report_paths: "junit/test-results*.xml"

name: Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-26-intel]
        # zarr-python installs via the test extra as the read-verification
        # reference reader; every supported interpreter resolves 3.x. The
        # test-zarr2 leg of python-pixi.yml covers the 2.x major so
        # zarrista-written stores are checked against both reader majors.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip if missing
        shell: bash
        run: |
          curl --retry-all-errors --retry 3 --tlsv1.2 https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python -m ensurepip --upgrade || python "$RUNNER_TEMP/get-pip.py"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "py/.[test,dask-image,itk,cli,validate]"

      - name: Test with pytest
        # Bounded: the macos-26-intel / 3.14 cell twice starved its runner to death around the
        # hour mark, losing the logs with it. A step timeout turns the next hang into a killed
        # step whose log names the test.
        timeout-minutes: 40
        run: |
          cd py && pytest -v

  pyodide:
    # The package inside Pyodide, hosted by Node (JSPI needs Node >= 25):
    # py/test/pyodide/run.mjs installs the wheel with micropip and runs
    # test_pyodide.py against the @fideus-labs/ngff-zarr JS package.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: py/test/pyodide/package-lock.json

      - name: Build the wheel
        run: python -m pip wheel py/ -w py/dist --no-deps

      - name: Run the Pyodide harness
        run: |
          cd py/test/pyodide
          npm ci
          node run.mjs

name: Python Dask pre-sharding
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          # zarr-python is a test-only dependency that verifies
          # zarrista-written stores; this leg pins the 3.x reference reader
          # alongside the pinned Dask.
          - python-version: "3.12"
            zarr-version: ">=3.0.0"
            dask-version: "==2026.1.2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "py/.[test,dask-image,itk,cli,validate]"

      - name: Install Dask and Zarr
        run: |
          python -m pip install "dask${{ matrix.dask-version }}" "distributed${{ matrix.dask-version }}"
          python -m pip install "zarr${{ matrix.zarr-version }}"

      - name: Test with pytest
        run: |
          cd py && pytest --junitxml=junit/test-results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v2
        with:
          report_paths: "junit/test-results*.xml"

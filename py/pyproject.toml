[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ngff-zarr"
description = 'A lean and kind Open Microscopy Environment (OME) Next Generation File Format (NGFF) Zarr implementation.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [{ name = "Matt McCormick", email = "matt@fideus.io" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "dask[array]!=2025.12.0,!=2026.1.0,!=2026.1.1",
  "importlib_resources",
  "itkwasm >= 1.0b183",
  "itkwasm-downsample >= 1.8.0",
  "numpy",
  "platformdirs",
  "psutil; sys_platform != \"emscripten\"",
  "rich",
  "rich-argparse",
  "typing_extensions",
  "zarr",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/thewtex/ngff-zarr#readme"
Issues = "https://github.com/thewtex/ngff-zarr/issues"
Source = "https://github.com/thewtex/ngff-zarr"
Changelog = "https://github.com/thewtex/ngff-zarr/releases"

[project.scripts]
ngff-zarr = "ngff_zarr.cli:main"

[tool.hatch.version]
path = "ngff_zarr/__about__.py"

[project.optional-dependencies]
dask-image = ["dask-image"]
itk = ["itk-filtering>=5.3.0"]
cli = [
  "dask-image",
  "dask[distributed]",
  "itk-filtering>=5.3.0",
  "itk-io>=5.3.0",
  "itkwasm-image-io",
  "imageio",
  "nibabel",
  "tifffile>=2024.7.24",
  "liffile",
  "imagecodecs>=2025.3.30,<2026.5.0",
]
tensorstore = ["tensorstore"]
test = [
  "pytest >=6",
  "pooch",
  "deepdiff"
]
validate = [
  "jsonschema"
]
docs = [ "furo>=2024.7.18,<2025", "myst-parser>=3.0.1,<4", "sphinx>=7.4.7,<8", "sphinx-autodoc2>=0.5.0,<0.6", "sphinx-copybutton>=0.5.2,<0.6", "sphinx-design>=0.6.0,<0.7", "sphinxext-opengraph>=0.9.1,<0.10", "sphinx-autobuild>=2024.4.16,<2025"]
all = ["ngff-zarr[cli]", "ngff-zarr[docs]", "ngff-zarr[test]", "ngff-zarr[validate]", "ngff-zarr[tensorstore]"]


[tool.coverage.report]
run.source = ["ngff_zarr"]
report.exclude_lines = [
  "no cov",
  '\.\.\.',
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.pytest.ini_options]
minversion = "6.0"
filterwarnings = [
  "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",
]
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.ruff]
src = ["ngff_zarr"]
exclude = []
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",   # flake8
  "B",   # flake8-bugbear
  "I",   # isort
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "ICN", # flake8-import-conventions
  "ISC", # flake8-implicit-str-concat
  "G",   # flake8-logging-format
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "UP",  # pyupgrade
  "YTT", # flake8-2020
  "EXE", # flake8-executable
  "NPY", # NumPy specific rules
  "PD",  # pandas-vet
]
extend-ignore = [
  "PLR",     # Design related pylint codes
  "PLC",     # Convention codes (lazy imports are intentional, etc.)
  "PLW",     # Warning codes
  "E501",    # Line too long
  "EM",      # flake8-errmsg (exception string formatting)
  "G004",    # Logging statement uses f-string
  "NPY002",  # Replace legacy np.random calls (pervasive in tests)
  "T201",    # print found (used intentionally in CLI code)
  "B905",    # zip() without explicit strict= parameter
  "B904",    # raise in except should use from
  "B007",    # Loop control variable not used within loop body
  "B011",    # Do not assert False
  "B028",    # No stacklevel keyword in warnings.warn
  "EXE001",  # Shebang present but file is not executable
  "RUF005",  # Consider iterable unpacking instead of concatenation
  "RUF022",  # __all__ is not sorted
  "RUF043",  # pytest.raises match uses metacharacters
  "RUF059",  # Unused unpacked variable
  "PTH",     # flake8-use-pathlib (too many pre-existing violations)
  "PGH003",  # Use specific rule codes when ignoring type issues
  "RET504",  # Unnecessary assignment before return
  "SIM",     # flake8-simplify (too many pre-existing violations)
  "ARG001",  # Unused function argument
  "UP007",   # Use X | Y for type annotations (requires Python 3.10+)
  "UP036",   # Version block is outdated
  "PT006",   # Wrong type for pytest parametrize names
  "PT011",   # pytest.raises too broad
  "PT012",   # pytest.raises block should contain single statement
  "PT015",   # assert False should be pytest.fail
  "C416",    # Unnecessary comprehension
  "ICN001",  # Import alias does not follow convention
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
ngff-zarr = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test", "dask-image", "itk", "cli", "validate", "tensorstore"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true, solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true, solve-group = "default" }
data = { features = ["data"], no-default-feature = true, solve-group = "default" }

[tool.pixi.feature.test.dependencies]
python = ">=3.10,<3.15.0"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", description = "Run the test suite" }
download-test-data = "pytest -k test_from_ngff_zarr --maxfail=1 -v"

[tool.pixi.feature.lint.dependencies]
pre-commit = "*"
commitizen = "*"
pip = "*"

[tool.pixi.feature.lint.pypi-dependencies]
cz-ngff-zarr = { path = "../.commitizen", editable = true }

[tool.pixi.feature.lint.tasks]
pre-commit-install = { cmd = "pre-commit install --hook-type pre-commit --hook-type commit-msg", description = "Install pre-commit hooks" }
pre-commit-run = { cmd = "pre-commit run --all", description = "Run pre-commit hooks on all repository files" }
lint = { depends-on = ["pre-commit-run"], description = "Run linters" }
commit = { cmd = "cz c", description = "Interactive commit helper" }
version-check = { cmd = "cz version -p", description = "Check current package version" }
bump = { cmd = "cz bump", description = "Bump Python package version" }

[tool.pixi.feature.docs.tasks]
dev-docs = { cmd = "sphinx-autobuild . ./_build/html", cwd = "../docs", description = "Build the documentation" }

[tool.pixi.feature.docs.target.linux-64.tasks]
build-docs = { cmd = "make html", cwd = "../docs", description = "Build the documentation" }

[tool.pixi.feature.docs.target.osx-64.tasks]
build-docs = { cmd = "make html", cwd = "../docs", description = "Build the documentation" }

[tool.pixi.feature.docs.target.osx-arm64.tasks]
build-docs = { cmd = "make html", cwd = "../docs", description = "Build the documentation" }

[tool.pixi.feature.data.dependencies]
python = ">=3.10,<4"
pooch = ">=1.8.2,<2"

[tool.pixi.feature.data.tasks]
hash-data = { cmd = "tar cvf ../data.tar * && gzip -9 -f ../data.tar && echo 'New SHA256:' && python3 -c 'import pooch; print(pooch.file_hash(\"../data.tar.gz\"))'", cwd = "test/data", description = "Update the testing data tarball and get its sha256 hash" }

[tool.pixi.dependencies]
matplotlib = ">=3.10.6,<4"

[tool.commitizen]
name = "cz_ngff_zarr"
version = "0.36.0"
version_provider = "commitizen"
tag_format = "py-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = ".commitizen/templates/py_changelog.md.j2"
version_files = [
    "ngff_zarr/__about__.py:__version__"
]
bump_message = "chore(py): bump ngff-zarr to $new_version"
annotated_tag = true
gpg_sign = true
major_version_zero = true

[tool.commitizen.customize]
path = "../.commitizen"

[tool.commitizen.change_type_map]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
docs = "📚 Documentation"
style = "💎 Style"
refactor = "♻️ Refactoring"
perf = "⚡ Performance"
test = "✅ Testing"
build = "📦 Build"
ci = "🔧 CI/CD"
chore = "🧹 Chores"

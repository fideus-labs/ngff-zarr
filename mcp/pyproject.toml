[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ngff-zarr-mcp"
description = "Model Context Protocol server for OME-Zarr image conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "ome-zarr", "image-conversion", "microscopy"]
authors = [
    { name = "Matt McCormick", email = "matt@fideus.io" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    # >= 1.8.0 for the Streamable HTTP transport with stateless_http and
    # json_response support (MCP specification revision 2025-03-26);
    # < 2 because mcp 2.0 removed the mcp.server.fastmcp module.
    "mcp >= 1.8.0, < 2",
    "ngff-zarr[cli,tensorstore] >= 0.15.2",
    "pydantic >= 2.0",
    "httpx",
    "aiofiles",
    "pathvalidate",
    "requests",
    "aiohttp",
]
dynamic = ["version"]

[project.optional-dependencies]
cloud = [
    "s3fs",
    "gcsfs",
]
all = [
    "ngff-zarr[all]",
    "s3fs",
    "gcsfs",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy>=1.0.0",
    "ruff>=0.5.0",
    "hatch",
    "types-aiofiles",
    "types-psutil",
]

[project.urls]
Documentation = "https://github.com/thewtex/ngff-zarr#readme"
Issues = "https://github.com/thewtex/ngff-zarr/issues"
Source = "https://github.com/thewtex/ngff-zarr"

[project.scripts]
ngff-zarr-mcp = "ngff_zarr_mcp.server:main"

[tool.hatch.version]
path = "ngff_zarr_mcp/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["ngff_zarr_mcp"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=ngff_zarr_mcp {args:tests}"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
extend-ignore = ["E501"]

[tool.coverage.run]
source_pkgs = ["ngff_zarr_mcp", "tests"]
branch = true
parallel = true
omit = [
    "ngff_zarr_mcp/__about__.py",
]

[tool.coverage.paths]
ngff_zarr_mcp = ["ngff_zarr_mcp", "*/ngff-zarr-mcp/ngff_zarr_mcp"]
tests = ["tests", "*/ngff-zarr-mcp/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
# Basic type checking without being too strict
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = false
# Still check for some basic issues
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "ngff_zarr.*",
    "numcodecs.*",
]
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge", "pyconda"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
ngff-zarr-mcp = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
pytest = ">=8.4.1,<9"
pytest-asyncio = ">=1.0.0,<2"

[tool.pixi.feature.dev.pypi-dependencies]
ngff-zarr-mcp = { path = ".", editable = true, extras = ["dev"] }
ngff-zarr = { path = "../py", editable = true, extras = ["cli", "tensorstore"] }

[tool.pixi.feature.dev.tasks]
test = "pytest tests/"
test-cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=ngff_zarr_mcp tests/"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check --diff ."
typecheck = "mypy ngff_zarr_mcp tests"
build = "hatch build"
all-checks = { depends-on = ["lint", "format-check", "typecheck"] }
commit = { cmd = "../py/.pixi/envs/lint/bin/cz c", description = "Interactive commit helper" }
version-check = { cmd = "../py/.pixi/envs/lint/bin/cz version -p", description = "Check current package version" }
bump = { cmd = "../py/.pixi/envs/lint/bin/cz bump", description = "Bump MCP package version" }

[tool.pixi.feature.cloud.pypi-dependencies]
ngff-zarr-mcp = { path = ".", editable = true, extras = ["cloud"] }

[tool.pixi.feature.all.pypi-dependencies]
ngff-zarr-mcp = { path = ".", editable = true, extras = ["all"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
cloud = { features = ["cloud"], solve-group = "default" }
all = { features = ["all"], solve-group = "default" }

[tool.commitizen]
name = "cz_ngff_zarr"
version = "0.12.0"
version_provider = "commitizen"
tag_format = "mcp-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = ".commitizen/templates/mcp_changelog.md.j2"
version_files = [
    "ngff_zarr_mcp/__about__.py:__version__"
]
bump_message = "chore(mcp): bump ngff-zarr-mcp to $new_version"
annotated_tag = true
gpg_sign = true
major_version_zero = true

[tool.commitizen.customize]
path = "../.commitizen"

[tool.commitizen.change_type_map]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
docs = "📚 Documentation"
style = "💎 Style"
refactor = "♻️ Refactoring"
perf = "⚡ Performance"
test = "✅ Testing"
build = "📦 Build"
ci = "🔧 CI/CD"
chore = "🧹 Chores"

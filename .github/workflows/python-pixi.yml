name: Python Pixi

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      matrix:
        os: [ubuntu-24.04, macos-15-intel]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11
        with:
          pixi-version: v0.69.0
          manifest-path: ./py/pyproject.toml
          frozen: true

      - name: Run tests
        run: cd py && pixi run test

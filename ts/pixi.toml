[workspace]
name = "ngff-zarr-ts"
version = "0.1.0"
description = "TypeScript implementation of ngff-zarr for Node and the browser."
authors = ["Matt McCormick <matt@fideus.io>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]

[dependencies]
nodejs = ">=24.11"

# Thin aliases over the npm scripts in package.json (which call Vite+'s `vp`).
# Run `pixi run install` once after cloning or changing package-lock.json.
[tasks]
install = "npm ci"
test = "npm test"
lint = "npm run lint"
fmt = "npm run fmt"
check = "npm run check"
build = "npm run build"

[tasks.fmt-check]
cmd = "npm run fmt:check"

[tasks.lint-check]
cmd = "npm run lint"

[tasks.typecheck]
cmd = "npm run typecheck"

[tasks.dev-server]
cmd = "node test/browser/server.ts"

[tasks.test-browser]
cmd = "npm run test:browser"

[tasks.test-browser-ui]
cmd = "npm run test:browser:ui"

[tasks.test-browser-debug]
cmd = "npm run test:browser:debug"

[tasks.test-browser-bundle]
cmd = "npm run test:browser:bundle"

[tasks.test-node]
cmd = "npm run test:node"

[tasks.test-all]
cmd = "npm run test:all"

[tasks.build-npm]
# The publishable form of dist/: built, worker inlined for browsers, and the
# self-contained browser bundle for test/browser-npm/.
cmd = "npm run build:bundle"

[tasks.commit]
cmd = "../py/.pixi/envs/lint/bin/cz c"
description = "Interactive commit helper"

[tasks.version-check]
cmd = "../py/.pixi/envs/lint/bin/cz version -p"
description = "Check current package version"

[tasks.bump]
cmd = "../py/.pixi/envs/lint/bin/cz bump"
description = "Bump TypeScript package version"
